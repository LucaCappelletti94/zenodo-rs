---
name: echoes

"on":
  pull_request:

permissions:
  contents: read

concurrency:
  group: echoes-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Prepares the review with no write token, so fork pull requests are scanned
# too. echoes-post.yml posts it.
jobs:
  scan:
    name: echoes
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The settings match .echoes.toml, which local runs read.
      - uses: LucaCappelletti94/cargo-echoes@9d3e3917cbfde54b75a50204df645e33d8274b59 # v1.11.0
        with:
          version: 0.12.0
          threshold: 2
          min-tokens: 0
          functions: true
          fn-min-tokens: 30
          context-blocks: true
          context-min-tokens: 30
          all-targets: true
          max-comments: 20
          pr-number: ${{ github.event.pull_request.number }}
          mode: prepare
          payload: ${{ runner.temp }}/echoes-payload

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: echoes-payload
          path: ${{ runner.temp }}/echoes-payload
          retention-days: 7
          if-no-files-found: error
